name: gds

on:
  push:
  workflow_dispatch:

env:
  PDK_VERSION: 8afc8346a57fe1ab7934ba5a6056ea8b43078e71
  PDK_ROOT: ${{ github.workspace }}/pdk

jobs:
  gds:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Verify UTF-8 in text sources
        run: python3 scripts/check_utf8.py

      - name: Install LibreLane
        run: python3 -m pip install "librelane==3.0.14"

      - name: Install sky130A PDK (includes SRAM macros)
        run: |
          python3 -m ciel enable --pdk-family sky130 --pdk-root "$PDK_ROOT" "$PDK_VERSION"
          ls "$PDK_ROOT/sky130A/libs.ref/sky130_sram_macros/lef"

      - name: Run ODIN flow through GDS
        run: |
          librelane --dockerized --pdk-root "$PDK_ROOT" --run-tag ci \
            librelane/config.json

      - name: Check flow errors
        run: |
          RUN=librelane/runs/ci
          test -f "$RUN/final/gds/tt_um_wajahat_odin.gds"
          ! grep -q "^\[ERROR\]" "$RUN/flow.log"

      - name: Upload GDS and final views
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odin-final
          path: librelane/runs/ci/final

      - name: Upload run logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odin-librelane-run
          path: |
            librelane/runs/ci/flow.log
            librelane/runs/ci/error.log
            librelane/runs/ci/warning.log
            librelane/runs/ci/resolved.json
            librelane/runs/ci/*/reports
            librelane/runs/ci/*/*.log
