name: gds

on:
  push:
  workflow_dispatch:

env:
  PDK_VERSION: 8afc8346a57fe1ab7934ba5a6056ea8b43078e71
  PDK_ROOT: ${{ github.workspace }}/pdk

jobs:
  gds:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Verify UTF-8 in text sources
        run: python3 scripts/check_utf8.py

      - name: Install LibreLane
        run: python3 -m pip install "librelane==3.0.14"

      - name: Install sky130A PDK (includes SRAM macros)
        run: |
          python3 -m ciel enable --pdk-family sky130 --pdk-root "$PDK_ROOT" "$PDK_VERSION"
          ls "$PDK_ROOT/sky130A/libs.ref/sky130_sram_macros/lef"

      - name: Run ODIN flow through GDS
        run: |
          librelane --dockerized --docker-no-tty --pdk-root "$PDK_ROOT" --run-tag ci \
            librelane/config.json

      - name: Check flow errors
        run: |
          RUN=librelane/runs/ci
          test -f "$RUN/final/gds/tt_um_wajahat_odin.gds"
          ! grep -q "^\[ERROR\]" "$RUN/flow.log"

      - name: Verify DRC, LVS and timing results
        run: |
          python3 - <<'PY'
          import json, sys
          m = json.load(open("librelane/runs/ci/final/metrics.json"))
          keys = [
              "magic__drc_error__count",
              "klayout__drc_error__count",
              "route__drc_errors",
              "design__lvs_error__count",
              "design__xor_difference__count",
              "timing__setup_vio__count",
              "timing__hold_vio__count",
              "design__max_slew_violation__count",
              "design__max_cap_violation__count",
              "antenna__violating__nets",
          ]
          bad = False
          for k in keys:
              vals = {n: v for n, v in m.items() if n == k or n.startswith(k + "__corner:")}
              for n, v in sorted(vals.items()):
                  print(f"{n}: {v}")
                  if isinstance(v, (int, float)) and v > 0:
                      bad = True
          sys.exit(1 if bad else 0)
          PY

      - name: Upload GDS and final views
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odin-final
          path: librelane/runs/ci/final

      - name: Upload run logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odin-librelane-run
          path: |
            librelane/runs/ci/flow.log
            librelane/runs/ci/error.log
            librelane/runs/ci/warning.log
            librelane/runs/ci/resolved.json
            librelane/runs/ci/*/reports
            librelane/runs/ci/*-magic-streamout
            librelane/runs/ci/*-klayout-streamout
            librelane/runs/ci/*-reportmanufacturability
            librelane/runs/ci/*-magic-drc
            librelane/runs/ci/*-netgen-lvs
            librelane/runs/ci/*/*.log
